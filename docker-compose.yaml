
services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"   # Redireciona automaticamente para 8443
      - "8443:443"  # Porta HTTPS (Acesse: https://localhost:8443)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_SETUP_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_SETUP_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  backend:
    build: ./backend
    restart: on-failure
    expose:
      - "${BACKEND_PORT}"
    env_file:
      - .env
    environment:
      DB_HOST: db
      PORT: ${BACKEND_PORT}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node src/models/setup.js &&
             (node src/criarOperador.js maria 'Maria Silva' senhaForte123 || true) &&
             node ./src/appRU.js"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules


  frontend:
    build: ./frontend
    expose:
      - "5173"
    env_file:
      - .env
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules


volumes:
  mysql_data:
